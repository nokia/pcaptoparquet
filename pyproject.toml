[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcaptoparquet"
version = "0.2.20260907"
dependencies = [
    'dpkt',
    'cryptography',
    'psutil',
    'polars'
]
authors = [
  {name = "Pablo Rojo", email = "pablo.rojo@nokia.com"},
]
maintainers = [
]
description = "A package for converting pcap files to parquet format."
readme = "README.md"
license.file = "LICENSE"
keywords = ["pcap", "parquet", "csv", "json"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]
Homepage = "https://github.com/nokia/pcaptoparquet"
Issues = "https://github.com/nokia/pcaptoparquet/issues"

[project.scripts]
pcaptoparquet = "pcaptoparquet_cli:main"
pcaptoparquet-mcp = "pcaptoparquet_mcp.server:main"

[project.optional-dependencies]
mcp = [
    "mcp==2.1.1",
]
dev = [
    "black==26.5.1",
    "isort==9.0.1",
    "pyright==1.1.411",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "tox==4.61.2",
    "pytest==9.1.1",
    "coverage==7.16.0",
    "build==1.6.0",
    "twine==7.0.0",
    "pyinstaller==6.22.2",
    "mcp==2.1.1",
]

[tool.setuptools]
py-modules = ["pcaptoparquet_cli"]
packages = ["pcaptoparquet", "pcaptoparquet_mcp"]

[tool.setuptools.package-data]
pcaptoparquet_mcp = ["data/schema.md"]

[tool.tox]
envlist = ["py311"]

[tool.tox.env.py311]
deps = ["pytest==9.1.1", "mcp==2.1.1"]
commands = [
  ["pytest", "tests/"],
]

[tool.ruff]
line-length = 88
exclude = [".git", ".tox", ".venv*", "venv_build", "build", "dist", ".eggs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203", "E231", "E241", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403", "F401"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
src_paths = ["pcaptoparquet", "pcaptoparquet_mcp", "tests"]

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::polars.exceptions.CategoricalRemappingWarning",
]